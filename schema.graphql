type Mutation {
  updateSetting(set: UpdateSettingInput!, where: SettingFilters): [Setting!]!

  """
  Each entry's updated rows, in entry order. An entry whose `where` matched no rows contributes `null` in its slot; an entry that matched several contributes each of its rows.
  """
  updateSettingsMany(updates: [UpdateSettingManyInput!]!): [Setting]!
  updateSettingSingle(set: UpdateSettingInput!, where: SettingFilters!): Setting
  createSessions(values: [CreateSessionInput!]!): [Session!]!
  createSession(values: CreateSessionInput!): Session!
  updateSession(set: UpdateSessionInput!, where: SessionFilters): [Session!]!

  """
  Each entry's updated rows, in entry order. An entry whose `where` matched no rows contributes `null` in its slot; an entry that matched several contributes each of its rows.
  """
  updateSessionsMany(updates: [UpdateSessionManyInput!]!): [Session]!
  updateSessionSingle(set: UpdateSessionInput!, where: SessionFilters!): Session
  deleteSession(where: SessionFilters): [Session!]!
  deleteSessionSingle(where: SessionFilters!): Session

  """
  Writes the API key. Separate from the settings update because the key is write-only: it is excluded from `Setting` so it can never be read back out. An empty string clears it and falls back to $OPENAI_API_KEY.
  """
  setApiKey(apiKey: String!): Boolean!

  """
  Replaces the configured set and reconnects. The list is edited and saved whole — a server's id is the namespace its tools live under, so renaming one is a different server, not an edited row.
  """
  saveMcpServers(servers: [McpServerInput!]!): [McpServerState!]!

  """Tears down one server's connection and dials it again."""
  reconnectMcpServer(id: String!): [McpServerState!]!
}

