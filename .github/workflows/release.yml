# GHCR needs nothing set up: the GITHUB_TOKEN this workflow already has can push to it.
# Docker Hub is optional. Set both of these to publish there as well; with neither set,
# the Docker Hub steps are skipped and the release still goes out to GHCR.
#   DOCKERHUB_USERNAME — your Docker Hub username
#   DOCKERHUB_TOKEN    — a Docker Hub access token (not your password)

name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads the whole history to work out the next version, and
          # pushes with its own token rather than the checkout's.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          # @semantic-release/git is not bundled; it is what commits the version-bumped
          # package.json and lockfile back to main.
          extra_plugins: |
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Everything below runs only when the commits since the last tag actually amounted
      # to a release. A run of chores publishes nothing.
      - name: Log in to GitHub Container Registry
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional, so it is skipped rather than fatal when its secrets are
      # absent. Logging in unconditionally failed the step, which took the image build
      # down with it and left GHCR unpublished on a release that needed no setup at all.
      - name: Work out where the image can go
        id: targets
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          # GHCR rejects an uppercase path; the owner half of the repo name is free to
          # have one, so it is lowercased here rather than assumed.
          repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          {
            echo 'tags<<TAGS_EOF'
            echo "ghcr.io/${repo}:latest"
            echo "ghcr.io/${repo}:${VERSION}"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "${DOCKERHUB_USERNAME}/min-agent:latest"
              echo "${DOCKERHUB_USERNAME}/min-agent:${VERSION}"
            fi
            echo TAGS_EOF
          } >> "$GITHUB_OUTPUT"

          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_USERNAME is not set - publishing to GHCR only." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Log in to Docker Hub
        if: steps.targets.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.targets.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
