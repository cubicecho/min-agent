name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `build` typechecks before it bundles, so this covers `npm run typecheck` too.
      - name: Build
        run: npm run build

  # The Expo app has its own node_modules and its own tsconfig, so it is checked in a job
  # of its own rather than made a condition of the server's.
  mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      # The mobile tsconfig typechecks shared/, which imports zod and openai from the
      # root install — so the mobile install alone leaves those unresolvable.
      - run: npm ci

      - run: npm ci --prefix mobile

      - name: Typecheck
        run: npm run mobile:typecheck

  # The image is built on every change, unpushed, so a broken Dockerfile is caught here
  # rather than at release time when there is a version number riding on it.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: min-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the image and wait for /api/health
        run: |
          docker run -d --name min-agent -p 8787:8787 min-agent:ci
          for _ in $(seq 30); do
            if curl -fsS http://localhost:8787/api/health; then exit 0; fi
            sleep 2
          done
          echo "the server never became healthy"
          docker logs min-agent
          exit 1
