name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      # The database tests bring their own Postgres, in-process, so there is no service here.
      - name: Test
        run: npm test

      # `npm run build` also exports the Expo bundle, which needs the mobile install and is
      # covered by the docker job below. What is worth checking here is that the generated
      # GraphQL types still describe the schema and that everything typechecks against them.
      - name: Codegen and typecheck
        run: npm run codegen && npm run typecheck

      # Generated files are committed, so a schema change that was not regenerated should
      # fail here rather than reach a front end typed against the schema before it.
      - name: Check the generated files are current
        run: git diff --exit-code -- schema.graphql shared/gql/

  # The tests build their tables from the table definitions, not from `drizzle/`, so they
  # cannot tell that a migration fails to apply or was never generated. This can.
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: min_agent
          POSTGRES_PASSWORD: min_agent
          POSTGRES_DB: min_agent_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U min_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://min_agent:min_agent@localhost:5432/min_agent_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Migrations apply
        run: npm run db:migrate

      # drizzle-kit writes nothing when the tables and the migrations agree.
      - name: Migrations match the tables
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "::error::The tables changed without a migration. Run npm run db:generate and commit drizzle/."
            exit 1
          fi

  # The Expo app has its own node_modules and its own tsconfig, so it is checked in a job
  # of its own rather than made a condition of the server's.
  mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      # The mobile tsconfig typechecks shared/, which imports zod and openai from the
      # root install — so the mobile install alone leaves those unresolvable.
      - run: npm ci

      - run: npm ci --prefix mobile

      - name: Typecheck
        run: npm run mobile:typecheck

  # The image is built on every change, unpushed, so a broken Dockerfile is caught here
  # rather than at release time when there is a version number riding on it.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: min-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The server applies its migrations at boot and refuses to start without a database, so
      # booting the image is also a check that the schema it ships applies to an empty one.
      - name: Boot the image against a database
        run: |
          docker network create min-agent-ci
          docker run -d --name min-agent-db --network min-agent-ci \
            -e POSTGRES_USER=min_agent -e POSTGRES_PASSWORD=min_agent -e POSTGRES_DB=min_agent \
            --health-cmd "pg_isready -U min_agent" --health-interval 5s --health-retries 10 \
            postgres:18-alpine
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' min-agent-db)" = healthy ] && break
            sleep 2
          done
          docker run -d --name min-agent --network min-agent-ci -p 8787:8787 \
            -e DATABASE_URL=postgres://min_agent:min_agent@min-agent-db:5432/min_agent \
            min-agent:ci
          for _ in $(seq 30); do
            if curl -fsS -X POST http://localhost:8787/graphql \
              -H 'content-type: application/json' \
              -d '{"query":"{ health { ok } }"}' | grep -q '"ok":true'; then exit 0; fi
            sleep 2
          done
          echo "the server never became healthy"
          docker logs min-agent-db
          docker logs min-agent
          exit 1
