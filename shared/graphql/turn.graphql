# Subscribing runs the turn; ending the subscription stops it. One stream, so nothing said
# between "start" and "watch" can go missing — there is no gap to lose it in.
subscription Turn($sessionId: String!, $prompt: String!, $model: String) {
  turn(sessionId: $sessionId, prompt: $prompt, model: $model) {
    seq
    type
    text
    id
    name
    input
    toolUseId
    content
    isError
    level
    title
    stats
    hook
    elicitation
    action
    items
    ids
    message
  }
}

# Something typed while the chat's turn runs, for the turn to take at its next step. False when no
# turn there can take it any more, and then it goes as a turn of its own.
mutation SteerTurn($sessionId: String!, $id: String!, $text: String!) {
  steerTurn(sessionId: $sessionId, id: $id, text: $text)
}

# A question a tool's server asked during the turn, answered from the chat it was asked in. False
# when the question is no longer waiting: the call it belongs to may have ended first.
mutation AnswerElicitation(
  $sessionId: String!
  $id: String!
  $action: ElicitationAction!
  $content: JSON
) {
  answerElicitation(sessionId: $sessionId, id: $id, action: $action, content: $content)
}
