# The API key is excluded from `Setting` — it can only be written — so whether one is set is
# its own field, and the Config tab shows a filled placeholder rather than an empty box.
query Config {
  setting(where: { id: { eq: "default" } }) {
    baseUrl
    model
    maxTokens
    temperature
    maxToolIterations
    systemPrompt
    contextLimit
    toolDiscovery
    reasoningEffort
    taskModels
    pricing
    voiceBaseUrl
    sttModel
    ttsModel
    ttsVoice
    speakReplies
  }
  hasApiKey
}

mutation SaveConfig($set: UpdateSettingInput!) {
  updateSettingSingle(set: $set, where: { id: { eq: "default" } }) {
    id
  }
}

mutation SetApiKey($apiKey: String!) {
  setApiKey(apiKey: $apiKey)
}

query Models {
  models {
    id
    contextLength
  }
}

# The saved row as a `cubicecho.agent/1` document. JSON on the wire and to the app, which copies
# it out and never reads it; the API key is not in it.
query Spec {
  spec
}
