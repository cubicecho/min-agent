fragment McpState on McpServerState {
  config {
    id
    label
    enabled
    transport
    command
    args
    env
    url
    headers
  }
  status
  error
  tools {
    name
    description
  }
}

query McpStatus {
  mcpStatus {
    ...McpState
  }
}

mutation SaveMcpServers($servers: [McpServerInput!]!) {
  saveMcpServers(servers: $servers) {
    ...McpState
  }
}

mutation ReconnectMcpServer($id: String!) {
  reconnectMcpServer(id: $id) {
    ...McpState
  }
}

query McpPrompts {
  mcpPrompts {
    server
    serverLabel
    name
    title
    description
    arguments {
      name
      description
      required
    }
  }
}

query McpPrompt($server: String!, $name: String!, $args: JSON) {
  mcpPrompt(server: $server, name: $name, args: $args)
}
