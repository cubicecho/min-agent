# min-agent, as one container. `docker compose up -d`, then http://localhost:8787.
#
# Nothing in min-agent is authenticated, and the container reaches whatever the host can:
# the LLM server, the MCP servers, the LAN. Publish the port on a network you trust, or
# bind it to the loopback with `127.0.0.1:8787:8787` and reach it through something that
# does have a login.
services:
  min-agent:
    build: .
    image: min-agent
    ports:
      - '8787:8787'
    volumes:
      # config/ (llm.yaml, mcp.yaml) and data/sessions both live in here, and both are
      # seeded on first boot, so an empty directory is the right starting point.
      - ./docker-data:/data
    environment:
      # Only a fallback: an apiKey set in config/llm.yaml wins over it.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PORT: ${PORT:-8787}
    # `host.docker.internal` is how the container names the machine it is running on,
    # which is where an Ollama or LM Studio server usually is. Linux needs it spelled out;
    # Docker Desktop provides it already, where this line is harmless.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:" + (process.env.PORT || 8787) + "/api/health").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
